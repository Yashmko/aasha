<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AASHA · Admin</title>
<style>
:root{
  --bg:#fbfbfc; --panel:#fff; --panel2:#f4f5f7;
  --line:#e6e8ec; --line2:#d3d7de;
  --text:#0e0f12; --muted:#5b616c; --dim:#8a8f98;
  --accent:#ff6f91; --ink:#6b7cff; --mint:#5fe0a8; --sky:#7cc8ff; --lemon:#ffd166; --violet:#b78cff;
  --ok:#22a06b; --warn:#c98a1f; --risk:#e5484d;
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 60px}
header{position:sticky;top:0;z-index:50;background:rgba(251,251,252,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-bottom:28px}
header .in{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;text-decoration:none;color:var(--text)}
.logo .m{font-family:var(--mono);color:var(--accent);font-weight:700;border:1px solid var(--accent);border-radius:6px;padding:3px 7px}
header .r{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:12px;color:var(--dim)}
.refresh{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 14px;font:600 13px var(--sans);cursor:pointer}
.refresh:hover{background:#ff5a80}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:5px;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,160,107,.4)}70%{box-shadow:0 0 0 8px rgba(34,160,107,0)}100%{box-shadow:0 0 0 0 rgba(34,160,107,0)}}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.kpi .n{font-family:var(--mono);font-size:40px;font-weight:700;letter-spacing:-.02em}
.kpi .n b{color:var(--accent)}
.kpi .l{color:var(--dim);font-size:13px;margin-top:8px}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.panel .phead{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.panel .phead h3{margin:0;font-size:15px}
.panel .phead .tag{font-family:var(--mono);font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.1em}
.pbody{padding:8px 0}

.sen{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line)}
.sen:last-child{border-bottom:none}
.sen .av{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--ink));color:#fff;display:grid;place-items:center;font:700 15px var(--mono)}
.sen .info{flex:1;min-width:0}
.sen .info .nm{font-weight:700;font-size:14px}
.sen .info .sub{color:var(--dim);font-size:12px;margin-top:2px}
.sen .mood{font-family:var(--mono);font-size:13px}
.score-pill{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;font-family:var(--mono)}
.score-pill.ok{background:rgba(34,160,107,.12);color:var(--ok)}
.score-pill.warn{background:rgba(201,138,31,.12);color:var(--warn)}
.score-pill.risk{background:rgba(229,72,77,.12);color:var(--risk)}

.alert-item{display:flex;gap:12px;align-items:flex-start;padding:14px 20px;border-bottom:1px solid var(--line)}
.alert-item:last-child{border-bottom:none}
.alert-item .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:#fdf0f0;color:var(--risk);flex:0 0 30px}
.alert-item .bd .t{font-size:14px;font-weight:600}
.alert-item .bd .s{font-size:12px;color:var(--dim);margin-top:3px}
.empty{color:var(--dim);font-size:13px;padding:22px 20px;font-style:italic}

.mem{display:flex;gap:8px;align-items:center;padding:9px 20px;font-size:13px;color:var(--muted)}
.mem::before{content:"🧠";flex:0 0 auto}
.log{font-family:var(--mono);font-size:12px;padding:11px 20px;border-bottom:1px solid var(--line);color:var(--muted)}
.log .who{color:var(--text);font-weight:600}
.log .a{color:var(--accent);font-weight:700}
footer{text-align:center;color:var(--dim);font-size:12px;margin-top:40px;font-family:var(--mono)}
a{color:var(--accent)}
/* config status pills (safe: state only) */
.cfg{display:flex;gap:8px;flex-wrap:wrap}
.cfg-pill{font-family:var(--mono);font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted)}
.cfg-pill.ok{color:var(--ok);border-color:rgba(34,160,107,.4);background:rgba(34,160,107,.08)}
.cfg-pill.bad{color:var(--warn);border-color:rgba(201,138,31,.4)}
.cfg-pill.idle{color:var(--dim)}
</style>
</head>
<body>
<header>
  <div class="wrap in">
    <a class="logo" href="/"><span class="m">आशा</span> AASHA <span style="color:var(--dim);font-size:13px">admin</span></a>
    <div class="r"><span class="status-dot"></span><span id="live">live</span><button class="refresh" onclick="load()">Refresh</button></div>
  </div>
</header>

<div class="wrap">
  <div class="cfg" id="cfgPills" style="margin-bottom:22px">
    <span class="cfg-pill idle" data-k="backend">backend …</span>
    <span class="cfg-pill idle" data-k="aai">AssemblyAI …</span>
    <span class="cfg-pill idle" data-k="ai">agent brain …</span>
  </div>
  <div class="grid" id="kpis"></div>

  <div class="cols">
    <div class="panel"><div class="phead"><h3>Seniors under care</h3><span class="tag" id="senTag">0</span></div><div class="pbody" id="seniors"></div></div>
    <div class="panel"><div class="phead"><h3>Family alerts</h3><span class="tag">latest</span></div><div class="pbody" id="alerts"></div></div>
  </div>

  <div class="cols">
    <div class="panel"><div class="phead"><h3>What AASHA remembers</h3><span class="tag">memory</span></div><div class="pbody" id="memory"></div></div>
    <div class="panel"><div class="phead"><h3>Recent sessions</h3><span class="tag" id="sessTag">0</span></div><div class="pbody" id="sessions"></div></div>
  </div>

  <footer>AASHA admin · live data from the backend · <a href="/" >← back to home</a></footer>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function cls(sc){return sc>=80?'ok':sc>=55?'warn':'risk';}

async function refreshCfg(){
  try{
    const h=await (await fetch('/health')).json();
    document.querySelectorAll('.cfg-pill').forEach(p=>{ const k=p.dataset.k;
      if(k==='backend'){ p.className='cfg-pill '+(h?.service?'ok':'bad'); p.textContent=h?.service?'backend · live':'backend offline'; }
      if(k==='aai'){ p.className='cfg-pill '+(h?.assembly?.configured?'ok':'bad'); p.textContent=h?.assembly?.configured?'AssemblyAI · ready':'AssemblyAI · no key'; }
      if(k==='ai'){ const br=h?.ai?.brain; const on=br && br!=='fallback'; p.className='cfg-pill '+(on?'ok':'bad'); p.textContent= br==='assembly'?'agent brain · AssemblyAI':(on?('agent brain · '+br):'agent brain · fallback'); }
    });
  }catch(e){ document.querySelectorAll('.cfg-pill').forEach(p=>{p.className='cfg-pill bad';p.textContent='offline';}); }
}

async function load(){
  refreshCfg();
  try{
    const o=await (await fetch('/api/overview')).json();
    const s=await (await fetch('/api/sessions')).json();
    const alerts=await (await fetch('/api/alerts')).json();
    const seniorsBy=o.seniors||[];

    // KPIs
    $('kpis').innerHTML=[['seniors',o.total],['sessions',o.sessions],['alerts',o.alerts],['due today',o.dueToday]]
      .map(([l,n])=>`<div class="kpi"><div class="n">${n}</div><div class="l">${esc(l)}</div></div>`).join('');
    $('senTag').textContent=o.total; $('sessTag').textContent=o.sessions;

    // seniors
    $('seniors').innerHTML =(seniorsBy.length?seniorsBy.map(x=>{
      const sc=x.careState?.score??0, mood=x.careState?.mood;
      return `<div class="sen"><div class="av">${esc((x.name||'?')[0])}</div>
        <div class="info"><div class="nm">${esc(x.name||'')} · ${esc(x.age||'')}</div>
        <div class="sub">${esc(x.city||'') || 'India'} · mood ${mood==null?'—':mood+'/10'} · memory ${esc(x.memory||0)||0} · alerts ${esc(x.pendingAlerts||0)}</div></div>
        <span class="score-pill ${cls(sc)}">${sc}/100</span></div>`;}).join(''):'<div class="empty">No seniors yet.</div>');

    // alerts
    $('alerts').innerHTML =(alerts.length?alerts.slice(0,8).map(a=>`
      <div class="alert-item"><div class="ic">⚠</div><div class="bd">
        <div class="t">${esc(a.reason||'health flag')}</div>
        <div class="s">${esc(a.seniorId||'')} · ${new Date(a.at).toLocaleString()}${a.detail?.summary?' · '+esc(a.detail.summary.slice(0,50))+'…':''}</div></div></div>`).join(''):'<div class="empty">No alerts. Good.</div>');

    // memory (from first senior)
    const first = seniorsBy[0];
    if(first){ const r=await (await fetch('/api/seniors/'+first.seniorId+'/memory')).catch(()=>null);
      // seniorsBy entries don't carry id; use careState. Fallback: overview seniors lack id. Try list.
      const list=await (await fetch('/api/seniors')).json();
      const mem=(list[0]?.memory)||[];
      $('memory').innerHTML = mem.length? mem.map(m=>`<div class="mem">${esc(m.text)}</div>`).join('') : '<div class="empty">AASHA hasn&#39;t learned anything yet.</div>';
    } else $('memory').innerHTML='<div class="empty">No seniors yet.</div>';

    // sessions
    $('sessions').innerHTML =(s.length?s.slice(0,8).map(x=>{
      const last=x.messages?.slice(-1)[0];const who=x.seniorId||'';
      return `<div class="log"><span class="who">${esc(who)}</span> · ${esc(x.lang||'')} · ${new Date(x.startedAt).toLocaleTimeString()}<br>${last?`<span class="a">${esc(last.role)}</span>: ${esc(last.text).slice(0,90)}`:''}</div>`;}).join(''):'<div class="empty">No sessions yet. Start one from the home page.</div>');

    $('live').textContent='live';
  }catch(e){ $('live').textContent='offline'; }
}
load(); setInterval(load,8000);
</script>
</body>
</html>
